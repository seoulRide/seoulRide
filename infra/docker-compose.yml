services:
  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
      args:
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
    image: seoulride-web:latest
    container_name: seoulride-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY:-}
      KMA_API_KEY: ${KMA_API_KEY:-}
      SOLAR_API_KEY: ${SOLAR_API_KEY:-}
      NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${NEXT_PUBLIC_NAVER_MAP_CLIENT_ID}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    expose:
      - "3000"
    networks:
      - seoulride-net

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    image: seoulride-nginx:latest
    container_name: seoulride-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      # 벼리 웹앱(Expo 정적 export) 산출물. byeori 레포에서 빌드해 이 볼륨에 넣는다.
      - byeori-web:/var/www/byeori:ro
    depends_on:
      - web
    networks:
      - seoulride-net

  certbot:
    image: certbot/certbot:latest
    container_name: seoulride-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

networks:
  seoulride-net:
    driver: bridge

volumes:
  certbot-etc:
    name: seoulride-certs
    external: true
  certbot-www:
    name: seoulride-certbot-www
    external: true
  # 벼리 웹앱 정적 파일. byeori 레포의 `npx expo export --platform web` 산출물을 여기에 넣는다.
  byeori-web:
    name: byeori-web
