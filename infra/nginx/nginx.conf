user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 쿼리스트링을 빼고 경로만 남기는 포맷($request 대신 $uri).
    # 검색어가 ?keyword=... 로 오는 서비스에 쓴다 — 로그에 남으면 사용자의 검색 기록을
    # 보관하는 셈이 되어 Play 데이터 보안 신고에서 "임시 처리"로 답할 수 없게 된다.
    # 기본 main 포맷은 그대로 두므로 다른 vhost의 디버깅에는 영향이 없다.
    log_format  noquery  '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
