# 벼리 웹앱(byeori.ernebi.org) — Expo 정적 export를 직접 서빙하고 /api는 백엔드로 프록시한다.
# 앱과 API를 같은 오리진에 두어 CORS를 아예 만들지 않는다.
#
# 정적 파일은 byeori-web 볼륨에 있다. 갱신 방법:
#   cd apps/app && npx expo export --platform web
#   docker run --rm -v byeori-web:/dst -v "$PWD/dist":/src:ro alpine \
#     sh -c 'rm -rf /dst/* && cp -a /src/. /dst/'

server {
    listen 80;
    server_name byeori.ernebi.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name byeori.ernebi.org;

    ssl_certificate     /etc/letsencrypt/live/byeori.ernebi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byeori.ernebi.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 8m;

    # 검색어가 ?keyword= 로 오므로 쿼리스트링을 로그에 남기지 않는다(byeori.conf와 동일 정책).
    access_log /var/log/nginx/access.log noquery;

    # ── API: 같은 오리진으로 프록시 ──
    location /api/ {
        # 컨테이너 재생성으로 IP가 바뀌어도 따라가도록 요청 시점에 재조회한다.
        resolver 127.0.0.11 valid=10s;
        set $byeori_api http://byeori-api:8080;
        proxy_pass $byeori_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ── 정적 자산: 해시가 박힌 파일이라 영구 캐시 ──
    location /_expo/ {
        root /var/www/byeori;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /assets/ {
        root /var/www/byeori;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── 앱 라우트 ──
    # expo export --platform web(output: static)은 라우트마다 .html을 만든다.
    # /venue/2 같은 동적 경로는 파일이 없으므로 SPA 진입점(index.html)으로 떨어뜨린다.
    location / {
        root /var/www/byeori;
        try_files $uri $uri.html $uri/index.html /index.html;
        # HTML은 캐시하지 않는다 — 재배포가 바로 반영돼야 한다.
        add_header Cache-Control "no-cache";
    }
}
