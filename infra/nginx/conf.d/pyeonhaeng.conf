# 편행지도 vhost — pyeonhaeng.ernebi.org → pyeonhaeng-web 컨테이너
# pyeonhaeng-web은 /home/hidi/dev/convenienceStore/infra/docker-compose.yml 로 기동되며
# infra_seoulride-net 네트워크에 합류해 있다. (mibible 패턴과 동일)
server {
    listen 80;
    server_name pyeonhaeng.ernebi.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pyeonhaeng.ernebi.org;

    ssl_certificate     /etc/letsencrypt/live/pyeonhaeng.ernebi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pyeonhaeng.ernebi.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 8m;

    location / {
        # pyeonhaeng-web 컨테이너가 재생성돼 IP가 바뀌어도 따라가도록
        # 도커 내장 DNS(127.0.0.11)로 매번 재조회
        resolver 127.0.0.11 valid=10s;
        set $pyeonhaeng_upstream http://pyeonhaeng-web:3000;
        proxy_pass $pyeonhaeng_upstream;
        proxy_http_version 1.1;
        # Next.js 리다이렉트/RSC 응답 헤더가 기본 버퍼(4k)보다 커서 502가 나는 것 방지
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
