# 벼리(byeori) vhost — byeori.seoulride.site → byeori-api 컨테이너
server {
    listen 80;
    server_name byeori.seoulride.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name byeori.seoulride.site;

    ssl_certificate     /etc/letsencrypt/live/byeori.seoulride.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byeori.seoulride.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 8m;

    # 장소·공연 검색어가 ?keyword= 로 오므로 쿼리스트링을 로그에 남기지 않는다.
    access_log /var/log/nginx/access.log noquery;

    location / {
        # byeori-api 컨테이너가 재생성돼 IP가 바뀌어도 따라가도록
        # 도커 내장 DNS(127.0.0.11)로 매번 재조회 (변수를 쓰면 기동 시 1회 고정이 아닌 런타임 조회가 됨)
        #
        # 이걸 안 쓰면: api보다 nginx가 먼저 뜬 경우 이름이 ISP의 NXDOMAIN 대체 IP로 고정돼
        # 모든 HTTPS 요청이 그 주소로 SYN만 보내고 매달린다(로그엔 499만 남는다).
        # 2026-08-27에 이 증상으로 /account-deletion이 죽어 Play Console 검증이 실패했다.
        resolver 127.0.0.11 valid=10s;
        set $byeori_upstream http://byeori-api:8080;
        proxy_pass $byeori_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
