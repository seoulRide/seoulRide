name: bike-daily

# Daily refresh of foreigner-bike rentals → popular_stations.json.
# Runs at 21:00 UTC = 06:00 KST — outside Korean gov't system maintenance
# window (typically 02:00~05:00 KST) when Seoul OpenAPI backend periodically
# stalls. Staggered with events-daily (21:10 UTC) and trending-daily
# (21:20 UTC) so the three workflows don't race on `git push` to main.
# Each reads yesterday's popular_stations from the committed mobile-assets
# fallback, which is fine because the TOP-50 ranking is built from monthly
# aggregates and rarely shifts day-to-day.

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: bike-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest station master (CSV)
        run: pnpm ingest:master

      - name: Ingest Seoul OpenAPI services
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: pnpm ingest

      - name: Recompute popular stations
        run: pnpm analyze:bike

      - name: Upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm upsert:popular_stations

      - name: Sync committed mobile-assets fallback
        run: cp _workspace/02_analytics/popular_stations.json apps/mobile/assets/data/popular_stations.json

      - name: Verify output
        run: |
          test -s apps/mobile/assets/data/popular_stations.json
          jq 'length' apps/mobile/assets/data/popular_stations.json

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/data/popular_stations.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "chore(bike): daily refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main…"
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
