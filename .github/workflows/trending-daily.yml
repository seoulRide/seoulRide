name: trending-daily

# Daily refresh of the AI hotplace pipeline (Reddit + Visit Seoul + NAVER →
# Solar Pro 2 extract + synthesize). Primary sink is Supabase (web reads via
# anon key with 1h ISR). The committed mobile-assets snapshot is the offline
# fallback.
# Runs at 21:00 UTC = 06:00 KST in parallel with bike-daily and events-daily,
# outside the Korean gov't system maintenance window (02:00~05:00 KST) per
# earlier outages on the Seoul OpenAPI backend during early-morning hours.

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: # manual trigger for first run / debugging

permissions:
  contents: write # needed to commit + push trending.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: trending-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run trending pipeline
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: pnpm trending:run

      - name: Verify trending.json
        run: |
          test -s _workspace/05_trending/trending.json
          jq 'length' _workspace/05_trending/trending.json

      - name: Upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm upsert:trending

      - name: Sync committed mobile-assets fallback
        run: cp _workspace/05_trending/trending.json apps/mobile/assets/data/trending.json

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/data/trending.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "chore(trending): daily refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main…"
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
