name: events-daily

# Daily refresh of cultural events curated to popular stations.
# Runs at 21:00 UTC = 06:00 KST in parallel with bike-daily and trending-daily
# (outside Korean gov't system maintenance window 02:00~05:00 KST). Reads
# popular_stations from the committed mobile-assets fallback (yesterday's
# snapshot) — fine because monthly-aggregate ranking is near-static.

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write # commits the mobile-assets fallback for the mobile app

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: events-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Ingest station master (CSV)
        run: pnpm ingest:master

      - name: Ingest Seoul OpenAPI services
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: pnpm ingest

      - name: Curate events by station
        run: pnpm curate:events

      - name: Translate event titles (Solar Pro 2)
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: pnpm translate:events

      - name: Upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm upsert:events

      - name: Sync committed mobile-assets fallback
        run: cp _workspace/03_curation/events_by_station.json apps/mobile/assets/data/events_by_station.json

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/data/events_by_station.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "chore(events): daily refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main…"
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
